name: "CD: Deploy Platform"
on:
  pull_request:
    branches: [dev, uat]
    types: [closed]

jobs:
  # --- Deployment for DEV ---
  deploy-dev:
    if: github.event.pull_request.merged == true && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      
      - name: Validate Dev Bundle
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy to Dev
        run: databricks bundle deploy -t dev --auto-approve
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  # --- Deployment for UAT ---
  deploy-uat:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate UAT Bundle
        run: databricks bundle validate -t uat
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_UAT_TOKEN }}

      - name: Deploy to UAT
        run: databricks bundle deploy -t uat --auto-approve
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_UAT_TOKEN }}

      - name: Extract Pipeline Name and Run
        run: |
          # Install yq
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
          
          # Extract the first pipeline key found in the resources section
          PIPELINE_NAME=$(yq e '.resources.pipelines | keys | .[0]' databricks.yml)
          echo "Found pipeline: $PIPELINE_NAME"
          
          # Run it
          databricks bundle run -t dev $PIPELINE_NAME
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}